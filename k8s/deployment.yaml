apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuscore
  template:
    metadata:
      labels:
        app: campuscore
    spec:
      containers:
        - name: campuscore
          image: campuscore:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
