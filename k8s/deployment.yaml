apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscore
  labels:
    app: campuscore
spec:
  # One replica only: the embedded file-based H2 database cannot be shared by several pods.
  replicas: 1
  # Recreate stops the old pod before the new one starts, so two pods never open the same database file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: campuscore
  template:
    metadata:
      labels:
        app: campuscore
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: campuscore
          # Jenkins replaces this tag with the image it built (campuscore:<build number>).
          image: campuscore:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:h2:file:/data/campuscore
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: APP_DEMO_DATA
              value: "false"
            # Create this Secret before the first deploy (see README). Without it the default dev password is used.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campuscore-secrets
                  key: ADMIN_PASSWORD
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: campuscore-data
