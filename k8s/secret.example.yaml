# EXAMPLE ONLY. Do not put a real password in Git.
# Create the real Secret from the command line instead:
#   kubectl create secret generic campuscore-secrets --from-literal=ADMIN_PASSWORD='choose-a-strong-password'
apiVersion: v1
kind: Secret
metadata:
  name: campuscore-secrets
type: Opaque
stringData:
  ADMIN_PASSWORD: change-me
