spring.application.name=campuscore
# No datasource URL: Spring Boot creates a separate in-memory H2 database for every test context.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
app.admin.password=admin123
app.demo-data=false

# Tests write their uploads to a private temporary folder
app.upload.dir=${java.io.tmpdir}/campuscore-test-uploads
app.upload.max-bytes=10485760
