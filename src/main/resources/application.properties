spring.application.name=campuscore
server.port=8080

# Persistent file-based H2. Override with environment variables (Docker/Kubernetes set DB_URL to /data/campuscore).
# Kept compatible with a later move to PostgreSQL or MySQL: only the URL, driver and credentials change.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campuscore}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Used only to create the admin account the first time. Set ADMIN_PASSWORD outside local development.
app.admin.password=${ADMIN_PASSWORD:admin123}
# Optional sample data for a demonstration (APP_DEMO_DATA=true). Off by default.
app.demo-data=${APP_DEMO_DATA:false}

server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health

# Assignment attachments. In Kubernetes this folder is on the same persistent volume as the database (/data/uploads).
app.upload.dir=${UPLOAD_DIR:./data/uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
# The server accepts slightly more than the application limit, so the application can show its own friendly message.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:12MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:13MB}
