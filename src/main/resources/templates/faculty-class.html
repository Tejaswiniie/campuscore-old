<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class students</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: facultySide('classes')}"></aside>
  <main class="content">
    <a class="back" th:href="@{/faculty/classes}">&larr; My classes</a>
    <div class="page-head"><h1 th:text="${cls.subject.name}">Subject</h1>
      <p th:text="${cls.section.label}">Section</p></div>
    <div class="card">
      <p class="hint">Read-only view. Official records are changed by the admin.</p>
      <form th:action="@{/faculty/classes/{id}(id=${cls.id})}" method="get" class="search">
        <input type="text" name="q" th:value="${q}" placeholder="Search by roll number or name" aria-label="Search students">
        <button class="btn" type="submit">Search</button>
        <a th:if="${!#strings.isEmpty(q)}" th:href="@{/faculty/classes/{id}(id=${cls.id})}">Clear</a>
      </form>
      <div class="table-wrap"><table>
        <thead><tr><th>Roll number</th><th>Name</th><th>Attendance</th><th>CGPA</th></tr></thead>
        <tbody>
          <tr th:each="s : ${list}">
            <td th:text="${s.rollNo}"></td><td th:text="${s.name}"></td>
            <td th:text="${#numbers.formatDecimal(s.attendance,1,1)} + '%'"></td>
            <td th:text="${#numbers.formatDecimal(s.cgpa,1,2)}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(list)}"><td class="empty" colspan="4">No students found.</td></tr>
        </tbody>
      </table></div>
    </div>
  </main>
</div>
</body></html>
