<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Students</title>
<link rel="stylesheet" th:href="@{/admin.css}"></head>
<body>
<header th:replace="~{fragments :: adminTop('students')}"></header>
<main class="wrap">
  <div class="head"><h1>Students</h1><p>The roll number is the student's login ID and first password.</p></div>
  <p class="notice ok" th:if="${message}" th:text="${message}"></p>
  <p class="notice error" th:if="${error}" th:text="${error}"></p>
  <div class="panel">
    <h2>Add student</h2>
    <p class="meta" th:if="${#lists.isEmpty(sections)}">Create a department and a section first (Departments page). A student must belong to a section.</p>
    <form th:action="@{/admin/students}" th:object="${form}" method="post" class="form">
      <div><label for="rollNo">Roll number</label><input id="rollNo" type="text" th:field="*{rollNo}" maxlength="30" required></div>
      <div class="span2"><label for="name">Full name</label><input id="name" type="text" th:field="*{name}" maxlength="100" required></div>
      <div><label for="dob">Date of birth</label><input id="dob" type="date" th:field="*{dob}"></div>
      <div><label for="departmentId">Department</label>
        <select id="departmentId" th:field="*{departmentId}" required>
          <option value="">Select department</option>
          <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code} + ' - ' + ${d.name}">CSE - Computer Science</option>
        </select></div>
      <div><label for="yearOfStudy">Academic year</label>
        <select id="yearOfStudy" th:field="*{yearOfStudy}" required>
          <option value="">Select year</option>
          <option th:each="y : ${years}" th:value="${y.key}" th:text="${y.value}">1st Year</option>
        </select></div>
      <div><label for="sectionId">Section</label>
        <select id="sectionId" th:field="*{sectionId}" required th:attr="data-url=@{/admin/section-options}"
                th:disabled="${#lists.isEmpty(sectionOptions)}">
          <option value="">Select a section</option>
          <option th:each="sec : ${sectionOptions}" th:value="${sec.id}" th:text="'Section ' + ${sec.name}">Section A</option>
        </select>
        <small id="sectionHint" class="meta" aria-live="polite"></small></div>
      <div><label for="attendance">Attendance (%)</label><input id="attendance" type="number" step="0.01" min="0" max="100" th:field="*{attendance}" required></div>
      <div><label for="cgpa">CGPA (out of 10)</label><input id="cgpa" type="number" step="0.01" min="0" max="10" th:field="*{cgpa}" required></div>
      <div class="full"><button class="btn" type="submit">Create student</button></div>
    </form>
  </div>
  <div class="panel">
    <h2>All students</h2>
    <form th:action="@{/admin/students}" method="get" class="search">
      <input type="text" name="q" th:value="${q}" placeholder="Search by roll number or name" aria-label="Search students">
      <button class="btn" type="submit">Search</button>
      <a th:if="${!#strings.isEmpty(q)}" th:href="@{/admin/students}">Clear</a>
    </form>
    <div class="table-wrap"><table>
      <thead><tr><th>Roll number</th><th>Name</th><th>Department</th><th>Year</th><th>Section</th><th>Attendance</th><th>CGPA</th><th>Actions</th></tr></thead>
      <tbody>
        <tr th:each="s : ${list}">
          <td th:text="${s.rollNo}"></td><td th:text="${s.name}"></td><td th:text="${s.departmentCode}"></td>
          <td th:text="${s.yearLabel}"></td><td th:text="${s.sectionName}"></td>
          <td th:text="${#numbers.formatDecimal(s.attendance,1,1)} + '%'"></td><td th:text="${#numbers.formatDecimal(s.cgpa,1,2)}"></td>
          <td><a th:href="@{/admin/students/{id}/edit(id=${s.rollNo})}">Edit</a>
            <form class="inline" th:action="@{/admin/students/{id}/delete(id=${s.rollNo})}" method="post"
                  onsubmit="return confirm('Delete this student? Their login, complaints and idea memberships are removed too.')">
              <button class="btn-danger" type="submit">Delete</button></form></td>
        </tr>
        <tr th:if="${#lists.isEmpty(list)}"><td class="empty" colspan="8">No students found.</td></tr>
      </tbody>
    </table></div>
  </div>
</main>
<script th:src="@{/student-form.js}" defer></script>
</body></html>
