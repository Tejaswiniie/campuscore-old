<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Edit student</title>
<link rel="stylesheet" th:href="@{/admin.css}"></head>
<body>
<header th:replace="~{fragments :: adminTop('students')}"></header>
<main class="wrap">
  <div class="head"><h1>Edit student</h1><p>The roll number cannot be changed.</p></div>
  <p class="notice error" th:if="${error}" th:text="${error}"></p>
  <div class="panel">
    <h2>Student <span th:text="${rollNo}">ID</span></h2>
    <form th:action="@{/admin/students/{id}/edit(id=${rollNo})}" th:object="${form}" method="post" class="form">
      <div class="span2"><label for="name">Full name</label><input id="name" type="text" th:field="*{name}" maxlength="100" required></div>
      <div><label for="dob">Date of birth</label><input id="dob" type="date" th:field="*{dob}"></div>
      <div class="span2"><label for="sectionId">Section</label>
        <select id="sectionId" th:field="*{sectionId}" required>
          <option th:each="sec : ${sections}" th:value="${sec.id}" th:text="${sec.label}">CSE | Year 2 | Section A</option>
        </select></div>
      <div><label for="attendance">Attendance (%)</label><input id="attendance" type="number" step="0.01" min="0" max="100" th:field="*{attendance}" required></div>
      <div><label for="cgpa">CGPA (out of 10)</label><input id="cgpa" type="number" step="0.01" min="0" max="10" th:field="*{cgpa}" required></div>
      <div class="full"><button class="btn" type="submit">Save changes</button>
        <a th:href="@{/admin/students}">Cancel</a></div>
    </form>
  </div>
</main>
</body></html>
