<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: studentSide('dashboard')}"></aside>
  <main class="content">
    <div class="page-head"><h1>Welcome, <span th:text="${displayName}">student</span></h1>
      <p>Your attendance and academic standing at a glance.</p></div>
    <div class="card">
      <h2>Profile</h2>
      <dl class="facts">
        <div><dt>Roll number</dt><dd th:text="${id}"></dd></div>
        <div><dt>Name</dt><dd th:text="${student.name}"></dd></div>
        <div><dt>Department</dt><dd th:text="${student.departmentName}"></dd></div>
        <div><dt>Year</dt><dd th:text="${student.yearLabel}"></dd></div>
        <div><dt>Section</dt><dd th:text="${student.sectionName}"></dd></div>
        <div><dt>Date of birth</dt><dd th:text="${student.dob != null ? student.dob : 'Not added'}"></dd></div>
      </dl>
    </div>
    <div class="card">
      <h2>Academic standing</h2>
      <div class="rings">
        <div th:replace="~{fragments :: ring('Attendance', ${attendanceText}, ${attendancePercent}, ${attendanceZone}, ${attendanceLabel})}"></div>
        <div th:replace="~{fragments :: ring('CGPA', ${cgpaText}, ${cgpaPercent}, ${cgpaRingZone}, ${cgpaLabel})}"></div>
      </div>
    </div>
  </main>
</div>
</body></html>
