<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: studentSide('password')}"></aside>
  <main class="content">
    <div class="page-head"><h1>Change password</h1>
      <p>Choose a new password of at least 8 characters. It cannot be the same as your ID.</p></div>
    <div class="card">
      <p class="notice ok" th:if="${message}" th:text="${message}"></p>
      <p class="notice error" th:if="${error}" th:text="${error}"></p>
      <form th:action="@{/student/password}" method="post" class="form">
        <div class="full"><label for="currentPassword">Current password</label>
          <input id="currentPassword" name="currentPassword" type="password" required autocomplete="current-password"></div>
        <div><label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></div>
        <div><label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></div>
        <div class="full"><button class="btn" type="submit">Change password</button></div>
      </form>
    </div>
  </main>
</div>
</body></html>
