<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My classes</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: facultySide('classes')}"></aside>
  <main class="content">
    <div class="page-head"><h1>My classes</h1><p>Only the classes assigned to you by the admin are shown.</p></div>
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>Subject</th><th>Department</th><th>Year</th><th>Section</th><th>Students</th><th></th></tr></thead>
        <tbody>
          <tr th:each="c : ${classes}">
            <td th:text="${c.teaching.subject.label}"></td><td th:text="${c.teaching.section.department.code}"></td>
            <td th:text="${c.teaching.section.yearLabel}"></td><td th:text="${c.teaching.section.name}"></td>
            <td th:text="${c.studentCount}"></td>
            <td><a th:href="@{/faculty/classes/{id}(id=${c.teaching.id})}">View students</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(classes)}"><td class="empty" colspan="6">No classes assigned yet.</td></tr>
        </tbody>
      </table></div>
    </div>
  </main>
</div>
</body></html>
