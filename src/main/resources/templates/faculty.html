<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty Dashboard</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside th:replace="~{fragments :: facultySide('dashboard')}"></aside>
  <main class="content">
    <div class="page-head"><h1>Welcome, <span th:text="${displayName}">faculty</span></h1>
      <p>Your profile and classes.</p></div>
    <div class="card">
      <h2>Profile</h2>
      <dl class="facts">
        <div><dt>Faculty ID</dt><dd th:text="${id}"></dd></div>
        <div><dt>Name</dt><dd th:text="${faculty.name}"></dd></div>
        <div><dt>Department</dt><dd th:text="${faculty.departmentName}"></dd></div>
        <div><dt>Designation</dt><dd th:text="${faculty.designation}"></dd></div>
      </dl>
    </div>
    <div class="card">
      <h2>My classes</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Subject</th><th>Year</th><th>Section</th><th>Students</th><th></th></tr></thead>
        <tbody>
          <tr th:each="c : ${classes}">
            <td th:text="${c.teaching.subject.label}"></td><td th:text="${c.teaching.section.yearLabel}"></td>
            <td th:text="${c.teaching.section.department.code} + ' ' + ${c.teaching.section.name}"></td>
            <td th:text="${c.studentCount}"></td>
            <td><a th:href="@{/faculty/classes/{id}(id=${c.teaching.id})}">View students</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(classes)}"><td class="empty" colspan="5">No classes have been assigned to you yet. Ask the admin.</td></tr>
        </tbody>
      </table></div>
    </div>
  </main>
</div>
</body></html>
