<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty Dashboard</title>
<link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo">C</span>
      <div><strong>CampusCore</strong><small>Faculty portal (v5)</small></div></div>
    <nav><a class="active" th:href="@{/faculty}">Dashboard</a></nav>
    <div class="side-foot">
      <div class="user"><span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(id,0,1))}">U</span>
        <div><b th:text="${displayName}">User</b><small th:text="${id}">ID</small></div></div>
      <form th:action="@{/logout}" method="post"><button class="btn-ghost" type="submit">Log out</button></form>
    </div>
  </aside>
  <main class="content">
    <div class="page-head"><h1>Welcome, <span th:text="${displayName}">faculty</span></h1>
      <p>Your profile and classes.</p></div>
    <div class="card">
      <h2>Profile</h2>
      <dl class="facts">
        <div><dt>Faculty ID</dt><dd th:text="${id}"></dd></div>
        <div><dt>Department</dt><dd th:text="${faculty.department}"></dd></div>
        <div><dt>Designation</dt><dd th:text="${faculty.designation}"></dd></div>
        <div><dt>Qualifications</dt><dd th:text="${faculty.qualifications}"></dd></div>
      </dl>
    </div>
    <div class="grid two">
      <div class="card"><h2>My classes</h2><p class="hint">Your sections, students and results will appear here.</p></div>
      <div class="card"><h2>Assignments</h2><p class="hint">Assignments you post for a class will appear here.</p></div>
    </div>
  </main>
</div>
</body></html>
