<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Section students</title>
<link rel="stylesheet" th:href="@{/admin.css}"></head>
<body>
<header th:replace="~{fragments :: adminTop('departments')}"></header>
<main class="wrap">
  <div class="head"><p class="crumbs"><a th:href="@{/admin/departments}">Departments</a> /
      <a th:href="@{/admin/departments/{id}(id=${section.department.id})}" th:text="${section.department.code}">CSE</a> /
      <span th:text="${section.yearLabel}">2nd yr</span>, Section <span th:text="${section.name}">A</span></p>
    <h1><span th:text="${section.department.name}">Department</span>, <span th:text="${section.yearLabel}">2nd yr</span>, section <span th:text="${section.name}">A</span></h1>
    <p>Students of this section.</p></div>
  <p class="notice error" th:if="${error}" th:text="${error}"></p>
  <div class="panel">
    <form th:action="@{/admin/sections/{id}(id=${section.id})}" method="get" class="search">
      <input type="text" name="q" th:value="${q}" placeholder="Search by roll number or name" aria-label="Search students">
      <button class="btn" type="submit">Search</button>
      <a th:if="${!#strings.isEmpty(q)}" th:href="@{/admin/sections/{id}(id=${section.id})}">Clear</a>
    </form>
    <div class="table-wrap"><table>
      <thead><tr><th>Student ID</th><th>Name</th><th>Department</th><th>Year</th><th>Section</th><th>Attendance</th><th>CGPA</th></tr></thead>
      <tbody>
        <tr th:each="s : ${list}">
          <td th:text="${s.rollNo}"></td><td th:text="${s.name}"></td><td th:text="${s.departmentCode}"></td>
          <td th:text="${s.yearLabel}"></td><td th:text="${s.sectionName}"></td>
          <td th:text="${#numbers.formatDecimal(s.attendance,1,1)} + '%'"></td><td th:text="${#numbers.formatDecimal(s.cgpa,1,2)}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(list)}"><td class="empty" colspan="7">No students in this section.</td></tr>
      </tbody>
    </table></div>
  </div>
</main>
</body></html>
